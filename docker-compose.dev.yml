# Dev compose — deployed by Jenkins on the `develop` branch — UGT VoiceCare.
# Same shape as docker-compose.yml but with dev image/container names, dev
# host port, and a separate ClamAV/storage stack so a dev deploy can never
# touch production's files.
services:
  app:
    build:
      context: .
      target: runner
    image: ugt-voicecare-dev:latest
    pull_policy: never
    container_name: ugt-voicecare-dev
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3001}:3000'
    volumes:
      # Separate dev storage — never shares a path with prod (see prod compose).
      - /home/docker02/appdata/ugt-voicecare-dev/storage:/app/storage
    networks:
      - proxy-network
    environment:
      NODE_ENV: production
      # Dev .env MUST differ from prod in at least:
      #   DATABASE_URL       → separate dev DB (never point dev at prod data)
      #   BETTER_AUTH_SECRET → never share secrets between environments
      DATABASE_URL: ${DATABASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_URL: ${APP_URL:-}
      STORAGE_ROOT: /app/storage
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-26214400}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
      CLAMAV_TIMEOUT_MS: '30000'
      # [METHOD: SSO] Internal-CA TLS — same admin decision as prod compose
      # (docs/admin-handoff.md "TLS ภายในองค์กร"); dev may use a different
      # Keycloak endpoint, confirm separately if so.
      # NODE_EXTRA_CA_CERTS: /etc/ssl/certs/org-ca.pem
      # NODE_TLS_REJECT_UNAUTHORIZED: '0'
    depends_on:
      clamav:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  clamav:
    image: clamav/clamav:stable
    container_name: ugt-voicecare-dev-clamav
    restart: unless-stopped
    networks:
      - proxy-network
    volumes:
      - /home/docker02/appdata/ugt-voicecare-dev/clamav-db:/var/lib/clamav
    healthcheck:
      test: ['CMD-SHELL', 'clamdscan --ping 1 || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 3

networks:
  proxy-network:
    external: true
